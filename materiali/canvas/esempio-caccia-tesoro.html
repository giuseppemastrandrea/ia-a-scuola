<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caccia al tesoro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --muted: #6b6b6b; --accent: #2f54ff; --ok: #1a8f4a; --gold: #e8a400; --line: #e5e5e5; --soft: #f5f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: 'Inter', sans-serif; }
  details { border-bottom: 1px solid var(--line); padding: 10px 24px; }
  summary { cursor: pointer; font-weight: 600; color: var(--muted); }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 10px 0 6px; }
  textarea { font: inherit; font-size: 15px; width: 100%; height: 130px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; }
  button { font: inherit; font-weight: 600; font-size: 22px; padding: 14px 24px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; cursor: pointer; }
  button.main { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.found { background: var(--ok); color: #fff; border-color: var(--ok); font-size: 30px; padding: 18px 40px; }
  #stage-wrap { padding: 16px 24px; }
  #stage { position: relative; width: 1200px; height: 820px; margin: 0 auto; transform-origin: top left; }
  #top { display: flex; justify-content: space-between; align-items: center; }
  #title { font-weight: 800; font-size: 34px; letter-spacing: .03em; }
  #tappa { font-weight: 800; font-size: 24px; color: var(--accent); }
  #main { display: flex; gap: 40px; align-items: center; margin-top: 22px; padding: 30px 36px; border: 6px solid var(--accent); border-radius: 30px; background: var(--soft); min-height: 360px; }
  #testo { flex: 1; font-size: 44px; line-height: 1.3; font-weight: 600; }
  #testo .era { display: block; margin-top: 16px; color: var(--ok); font-weight: 800; }
  #box { flex: none; width: 280px; height: 290px; border: 6px dashed #9aa6c8; border-radius: 30px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 150px; font-weight: 800; color: #c3cbe0; }
  #box.open { border: 6px solid var(--ok); }
  #box img { width: 220px; height: 220px; }
  #aiuto { margin-top: 18px; font-size: 30px; font-weight: 600; min-height: 50px; text-align: center; }
  #aiuto img { width: 54px; height: 54px; vertical-align: middle; margin-right: 8px; }
  #controls { display: flex; justify-content: center; gap: 18px; margin-top: 14px; }
  #zaino { display: flex; align-items: center; gap: 10px; min-height: 90px; padding: 8px 18px; border: 3px dashed #c3cbe0; border-radius: 22px; margin-top: 28px; }
  #zaino b { font-size: 46px; }
  #zaino img { width: 64px; height: 64px; }
  #fine { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #fff; }
  #fine.on { display: flex; }
  #fine .scrigno { font-size: 150px; line-height: 1; }
  #fine h2 { font-size: 76px; color: var(--gold); margin: 10px 0 20px; }
  #fine .row { display: flex; gap: 16px; margin-bottom: 30px; }
  #fine .row img { width: 110px; height: 110px; }
  footer { font-size: 12px; color: var(--muted); padding: 8px 24px 24px; }
</style>
</head>
<body>
<details>
  <summary>Per la maestra: le tappe</summary>
  <label for="tappe">Una tappa per riga: oggetto con emoji | dove l'avete nascosto, con emoji | indovinello</label>
  <textarea id="tappe">cucchiaio 🥄 | vicino alla porta 🚪 | Sono di metallo e ho la pancia: con me mangi la minestra.
macchinina 🚗 | tra i libri 📚 | Ho quattro ruote e faccio brum brum, ma sto in una mano.
palla ⚽ | sotto una sedia 🪑 | Sono rotonda, salto e rimbalzo: con me si gioca in giardino.
pennello 🖌️ | vicino alla finestra 🪟 | Ho i capelli ma non ho la testa: li bagno nel colore.
orsetto 🧸 | nella cesta dei giochi 🧺 | Sono morbido e marrone, e dormo con te nel lettone.</textarea>
  <p><button class="main" id="crea">Crea la caccia</button></p>
</details>
<div id="stage-wrap"><div id="stage">
  <div id="top"><div id="title">CACCIA AL TESORO</div><div id="tappa"></div></div>
  <div id="main"><div id="testo"></div><div id="box">?</div></div>
  <div id="aiuto"></div>
  <div id="controls">
    <button id="ascolta">🔊 Ascolta</button>
    <button id="aiutino">💡 Aiutino</button>
    <button class="found" id="trovato">Trovato!</button>
    <button class="main" id="avanti" style="display:none">Avanti ➜</button>
  </div>
  <div id="zaino"><b>🎒</b></div>
  <div id="fine"><div class="scrigno">🎁</div><h2>BRAVI, ESPLORATORI!</h2><div class="row" id="trovati"></div><button class="main" id="ancora">Ricomincia</button></div>
</div></div>
<footer>Leggete l'indovinello, cercate l'oggetto in aula e, quando lo trovate, toccate "Trovato!".<br>Emoji: OpenMoji (openmoji.org), licenza CC BY-SA 4.0.</footer>

<script>
const W = 1200, H = 820;
const stage = document.getElementById('stage');
let tappe = [], n = 0, trovati = [];

function speak(text, rate) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT'; u.rate = rate || 0.85;
  speechSynthesis.speak(u);
}
function parse(s) {
  const m = s.trim().match(/^(.*?)\s*(\p{Extended_Pictographic}[\u{FE0F}\u{200D}\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}]*)?$/u);
  return { word: (m && m[1] || s).trim(), emoji: m && m[2] };
}
function imgUrl(emoji) {
  const code = [...emoji].map(c => c.codePointAt(0).toString(16).toUpperCase()).filter(c => c !== 'FE0F').join('-');
  return 'https://cdn.jsdelivr.net/npm/openmoji@15.1.0/color/svg/' + code + '.svg';
}
function img(w) { return w.emoji ? `<img src="${imgUrl(w.emoji)}" alt="${w.word}">` : ''; }
function articolo(p) {
  if (/^[aeiou]/i.test(p)) return "l'" + p;
  return (/a$/i.test(p) ? 'la ' : 'il ') + p;
}

function leggi() {
  tappe = document.getElementById('tappe').value.split('\n').filter(l => l.includes('|')).map(l => {
    const [oggetto, posto, testo] = l.split('|');
    return { oggetto: parse(oggetto), posto: parse(posto), testo: (testo || '').trim() };
  });
}
function mostra() {
  const t = tappe[n];
  document.getElementById('tappa').textContent = `TAPPA ${n + 1} DI ${tappe.length}`;
  document.getElementById('testo').textContent = t.testo;
  const box = document.getElementById('box');
  box.className = ''; box.innerHTML = '?';
  document.getElementById('aiuto').innerHTML = '';
  document.getElementById('trovato').style.display = '';
  document.getElementById('aiutino').style.display = '';
  document.getElementById('avanti').style.display = 'none';
  speak(t.testo);
}
function aiutino() {
  const p = tappe[n].posto;
  document.getElementById('aiuto').innerHTML = img(p) + 'Cercate ' + p.word + '!';
  speak('Cercate ' + p.word);
}
function trovato() {
  const t = tappe[n];
  const box = document.getElementById('box');
  box.className = 'open'; box.innerHTML = img(t.oggetto) || t.oggetto.word.toUpperCase();
  document.getElementById('testo').insertAdjacentHTML('beforeend', `<span class="era">Era ${articolo(t.oggetto.word).replace(t.oggetto.word, t.oggetto.word.toUpperCase())}!</span>`);
  speak('Era ' + articolo(t.oggetto.word) + '!');
  trovati.push(t.oggetto);
  document.getElementById('zaino').insertAdjacentHTML('beforeend', img(t.oggetto));
  document.getElementById('trovato').style.display = 'none';
  document.getElementById('aiutino').style.display = 'none';
  document.getElementById('avanti').style.display = '';
}
function avanti() {
  n++;
  if (n < tappe.length) { mostra(); return; }
  document.getElementById('trovati').innerHTML = trovati.map(img).join('');
  document.getElementById('fine').classList.add('on');
  speak('Bravi, esploratori! Avete trovato il tesoro!');
}
function build() {
  leggi(); n = 0; trovati = [];
  document.getElementById('zaino').innerHTML = '<b>🎒</b>';
  document.getElementById('fine').classList.remove('on');
  if (tappe.length) mostra();
}
function fit() {
  const avail = document.getElementById('stage-wrap').clientWidth - 48;
  const s = Math.min(1, avail / W);
  stage.style.transform = `scale(${s})`;
  document.getElementById('stage-wrap').style.height = (H * s + 32) + 'px';
}

document.getElementById('crea').onclick = build;
document.getElementById('ancora').onclick = build;
document.getElementById('aiutino').onclick = aiutino;
document.getElementById('trovato').onclick = trovato;
document.getElementById('avanti').onclick = avanti;
document.getElementById('ascolta').onclick = () => speak(tappe[n].testo);
window.addEventListener('resize', fit);
fit(); build();
</script>
</body>
</html>
